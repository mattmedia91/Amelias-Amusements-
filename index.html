  <noscript><h1>Amelia’s Amusements</h1><p>Old-school spins. New-family traditions. Chase squishy farm animals, rare pulls, and dye-free gumballs at five restored country arcade stands in Sussex Borough and Wantage, New Jersey.</p></noscript>

      {id:"main-street-barbers",number:3,name:"Main Street Barbers",address:"49/51 Main St, Sussex, NJ 07461",street:"49/51 Main St",locality:"Sussex",hours:"Tue–Sun hours vary (Closed Mon)",role:"Mid-Block Barbershop",machine:"Restored Dual-Head Country Arcade Stand (Non-Electric)",products:[["50¢","100% Dye-Free Holistic Gumballs"],["75¢","Country Farm Animal Collection & Handmade Craft Keepsakes"]],lat:41.2108,lng:-74.6072,maps:"https://www.google.com/maps/search/?api=1&query=Main+Street+Barbers+49+Main+St+Sussex+NJ+07461",tip:"Add a farm friend or handmade keepsake, then make Lorenzo’s your family pizza stop."},
      {id:"lorenzos-pizzeria",number:4,name:"Lorenzo's Pizzeria & Restaurant",address:"67 Main St, Sussex, NJ 07461",street:"67 Main St",locality:"Sussex",hours:"Daily 11:00 AM–9:00 PM",role:"Family Pizza & Takeout Lobby",machine:"Restored Dual-Head Country Arcade Stand (Non-Electric)",products:[["50¢","100% Dye-Free Holistic Gumballs"],["75¢","Country Farm Animal Collection & K-Pop Collector Drops"]],lat:41.2113,lng:-74.6069,maps:"https://www.google.com/maps/search/?api=1&query=Lorenzo%27s+Pizzeria+%26+Restaurant+67+Main+St+Sussex+NJ+07461",tip:"Pair a spin with a family meal, then finish the passport at Lukoil on Route 23."},

    const app=document.getElementById("app");let map=null,bounds=null,markers={},activeId=null;
    const logo=()=>`<svg viewBox="0 0 64 64" aria-label="Amelia's Amusements logo"><path d="M9 27 32 8l23 19" fill="none" stroke="#c93b2b" stroke-width="6"/><path d="M15 25h34v29H15z" fill="#1e1916" stroke="#f5b727" stroke-width="2.5"/><circle cx="32" cy="34" r="12" fill="#14110f" stroke="#f5b727" stroke-width="2.5"/><circle cx="27" cy="31" r="3.2" fill="#c93b2b"/><circle cx="35" cy="29" r="3" fill="#f7f1e3"/><circle cx="37" cy="37" r="3.4" fill="#2e6f4e"/><circle cx="28" cy="39" r="2.8" fill="#f5b727"/><path d="M25 48h14v6H25z" fill="#c93b2b" stroke="#f5b727" stroke-width="2"/></svg>`;

    const header=()=>`<header class="header"><a class="brand" href="${location.pathname}" data-link data-testid="brand-home">${logo()}<span><strong>Amelia’s</strong><small>Amusements · Sussex, NJ</small></span></a><nav class="nav"><a href="#map-section">Route Map</a><a href="#farm-animals">Farm Animals</a><a href="#holistic-gumballs">Holistic Gumballs</a><a href="#treasure-quest">Treasure Quest</a><a href="#hosts">Host a Stand</a></nav><a class="cta" href="#map-section">Find a stand</a><button class="menu" type="button" data-menu aria-label="Toggle navigation" data-testid="mobile-menu">Menu</button><nav class="mobile-nav" id="mobile-nav"><a href="#map-section">Route Map</a><a href="#farm-animals">Farm Animals</a><a href="#holistic-gumballs">Holistic Gumballs</a><a href="#treasure-quest">Treasure Quest</a><a href="#hosts">Host a Stand</a></nav></header>`;
    const stopHeader=()=>`<header class="header"><a class="brand" href="${location.pathname}" data-link data-testid="stop-brand-home">${logo()}<span><strong>Amelia’s</strong><small>Amusements · Sussex, NJ</small></span></a><nav class="stop-nav"><a href="${location.pathname}#map-section">Route Map</a><a href="${location.pathname}#treasure-quest">Treasure Quest</a><a href="${location.pathname}#hosts">Host a Stand</a></nav></header>`;
    const footer=()=>`<footer class="footer"><div class="brand">${logo()}<span><strong>Amelia’s Amusements</strong><small>Country arcade · Sussex & Wantage, NJ</small></span></div><p>Five stops. Ten farm friends.<br>One very good reason to explore together.</p><a href="${location.pathname}#route">Explore all five stops →</a></footer>`;
    const mapSection=(stop=false)=>`<section id="map-section" class="section"><div class="heading"><div><span class="eyebrow">${stop?"Your place on the trail":"The Sussex County treasure route"}</span><h2>${stop?"See this stop<br>on the route.":"Five stops.<br>One glowing trail."}</h2></div><p>Tap a numbered pin or jump straight to a storefront. Every stop has its own capsule mix, so the next spin is always worth the trip.</p></div><div class="map-box" data-testid="route-map"><div class="map-tools"><span>Jump to stop</span><div class="chip-row">${STOPS.map(s=>`<button class="chip" data-focus="${s.id}" data-testid="map-jump-${s.id}">#${s.number} ${s.name}</button>`).join("")}</div><button class="reset-map" data-reset-map data-testid="show-all-stops">Show all 5</button></div><div id="map" role="region" aria-label="Interactive map of Amelia's Amusements locations"></div></div></section>`;
    const getItems=key=>{try{const value=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(value)?value:[]}catch{return[]}};
    const quest=()=>{const farm=getItems("amelias_farm_animals_v1"),pass=getItems("amelias_route_passport_v1"),fp=Math.round(farm.length/13*100),pp=Math.round(pass.length/5*100);return`<section id="treasure-quest" class="section"><div class="heading"><div><span class="eyebrow">Your pocket-sized treasure hunt</span><h2>Collect them all.<br>Remember every spin.</h2></div><p>Tap each prize you pull and every stop you visit. Progress saves automatically in this browser—no account needed.</p></div><div class="quest-grid"><div class="quest-panel"><span class="hunt">Hunt #1</span><h3>Country Farm Animal Collection</h3><div class="progress-label"><span>Farm collection</span><b>${farm.length} / 13</b></div><div class="track" data-testid="farm-progress"><div class="fill" style="width:${fp}%"></div></div><span class="percent">${fp}% collected</span><div class="animals">${ANIMALS.map((a,i)=>{const id=a.toLowerCase(),on=farm.includes(id);return`<button class="animal ${on?"collected":""}" data-collect="${id}" aria-pressed="${on}" data-testid="collect-${id}"><strong>${String(i+1).padStart(2,"0")} · ${a}</strong><small>${on?"✓ Collected":"Tap to collect"}</small></button>`}).join("")}</div><div class="chases">${CHASES.map(c=>{const on=farm.includes(c[0]);return`<button class="chase ${on?"collected":""}" data-collect="${c[0]}" aria-pressed="${on}" data-testid="chase-${c[0]}"><small>${c[2]}</small><strong>${c[1]} ${on?"✓":""}</strong></button>`}).join("")}</div><button class="reset" data-reset="amelias_farm_animals_v1" data-testid="reset-farm">↻ Reset farm collection</button></div><div class="quest-panel passport"><span class="hunt">Hunt #2</span><h3>Sussex & Wantage Route Passport</h3><div class="progress-label"><span>Route passport</span><b>${pass.length} / 5</b></div><div class="track" data-testid="passport-progress"><div class="fill" style="width:${pp}%"></div></div><span class="percent">${pp}% collected</span><div class="stamps">${STOPS.map(s=>{const on=pass.includes(s.id);return`<button class="stamp ${on?"visited":""}" data-passport="${s.id}" aria-pressed="${on}" data-testid="passport-${s.id}"><b>${on?"✓":s.number}</b><span><small>${s.locality} · Stop #${s.number}</small><strong>${s.name}</strong></span></button>`}).join("")}</div>${pass.length===5?`<div class="master" data-testid="arcade-master"><small>Passport complete</small>★ Sussex & Wantage<br>Arcade Master ★</div>`:""}<button class="reset" data-reset="amelias_route_passport_v1" data-testid="reset-passport">↻ Reset route passport</button></div></div></section>`};
    const home=()=>{const scanned=STOPS.find(s=>s.id===new URLSearchParams(location.search).get("stop"));return`<div class="site">${header()}${scanned?`<aside class="scan" data-testid="scanned-banner"><span class="scan-num">${scanned.number}</span><div><small>Machine found · Stop #${scanned.number}</small><strong>Welcome from ${scanned.name}!</strong><p>${scanned.products.map(p=>p.join(" ")).join(" + ")}</p></div><a href="#stop-${STOPS[scanned.number%5].id}">Next: ${STOPS[scanned.number%5].name} →</a></aside>`:""}<main><section class="hero" data-testid="hero"><div><span class="eyebrow">● Country arcade · Sussex & Wantage, NJ</span><h1><span><b>Amelia’s</b></span><span><b>Amusements</b></span></h1><p class="lead">Old-school spins. New-family traditions. Chase squishy farm animals, rare pulls, and dye-free gumballs at five restored country arcade stands.</p><div class="actions"><a class="btn" href="#map-section">Start the family route →</a><a class="btn ghost" href="#treasure-quest">Build your collection</a></div><div class="proof"><div><strong>05</strong><span>Local route stops</span></div><div><strong>10</strong><span>Farm friends</span></div><div><strong>0</strong><span>Artificial dyes</span></div></div></div><div class="cabinet">${bulbs()}<div class="machine-img"><img src="${IMAGES.hero}" alt="Classic red vintage gumball and capsule toy vending machine"></div><span class="coin fifty"><small>Gumball globe</small><strong>50¢</strong><small>Twist & enjoy</small></span><span class="coin seventy"><small>Capsule head</small><strong>75¢</strong><small>Collect & trade</small></span><div class="plate"><span>Restored mechanical fun</span><strong>No plugs. Just possibility.</strong></div></div></section><div class="marquee"><div class="marquee-track"><span>100% DYE-FREE GUMBALLS</span><i>★</i><span>COUNTRY FARM ANIMALS</span><i>★</i><span>5 LOCAL STOPS</span><i>★</i><span>RESTORED MECHANICAL STANDS</span><i>★</i><span>ZERO ELECTRICITY</span><i>★</i><span>SUSSEX & WANTAGE, NJ</span><i>★</i><span>100% DYE-FREE GUMBALLS</span><i>★</i><span>COUNTRY FARM ANIMALS</span><i>★</i><span>5 LOCAL STOPS</span><i>★</i></div></div>${mapSection()}<section class="section"><div class="heading"><div><span class="eyebrow">Inside the dual-head stand</span><h2>Pick your kind<br>of happy.</h2></div><p>Two mechanical heads, two pocket-change adventures. Every route stop stocks dye-free gumballs alongside a rotating capsule lineup.</p></div><div class="products"><article class="product" id="farm-animals"><div class="photo"><img src="${IMAGES.farm}" alt="Miniature collectible animal figures" loading="lazy"><span>The flagship collection</span></div><div class="product-body"><span class="price">75¢ · Capsule spin</span><h3>Country Farm Animal Collection</h3><p>Ten squishy barnyard pencil toppers and desk buddies, plus Rare, Ultra Rare, Crazy Rare, Glowing, Glitter, and Gold Trophy chase variants. Each 1.1” capsule includes an online game code.</p><div class="roster">${ANIMALS.map(a=>`<span>${a}</span>`).join("")}</div></div></article><article class="product" id="holistic-gumballs"><div class="photo"><img src="${IMAGES.gum}" alt="Retro gumball dispenser filled with colorful gumballs" loading="lazy"><span>Stocked at all five stops</span></div><div class="product-body"><span class="price">50¢ · Gumball spin</span><h3>100% Dye-Free Holistic Gumballs</h3><p>Classic gumball fun without artificial food dyes. Naturally colored with fruit and vegetable extracts, so families can enjoy the ritual with a little more peace of mind.</p><ul class="clean"><li>✓ No Red 40</li><li>✓ No Yellow 5</li><li>✓ No Blue 1</li><li>✓ Fruit & vegetable colored</li></ul></div></article></div></section><section id="route" class="section"><div class="heading"><div><span class="eyebrow">Meet your route partners</span><h2>A different find<br>behind every door.</h2></div><p>Spin here, support there. Each participating business helps make the route possible—explore their exact machine setup and plan your next local stop.</p></div><div class="locations">${STOPS.map(s=>`<div class="location" id="stop-${s.id}"><article class="card ${activeId===s.id?"active":""}" data-testid="location-${s.id}"><div class="stop-top"><b>${String(s.number).padStart(2,"0")}</b><span>${s.role}</span></div><h3>${s.name}</h3><div class="meta"><span>Address: ${s.address}</span><span>Hours: ${s.hours}</span></div><div class="machine"><small>The machine</small><strong>${s.machine}</strong></div><div class="stock"><small>On this stand</small>${s.products.map(p=>`<div><b>${p[0]}</b><p>${p[1]}</p></div>`).join("")}</div><p class="tip">♡ ${s.tip}</p><div class="card-actions"><button class="btn small" data-focus="${s.id}" data-scroll-map data-testid="show-map-${s.id}">Show on map</button><a class="btn small ghost" href="${s.maps}" target="_blank" rel="noopener">Directions ↗</a><a class="btn small ghost" href="?guide=${s.id}" data-link data-testid="guide-${s.id}">Stop guide →</a></div></article></div>`).join("")}</div></section>${quest()}<section class="section"><div class="family"><div class="family-photo photo"><img src="${IMAGES.arcade}" alt="Warm glowing retro arcade marquee lights" loading="lazy"></div><div class="family-content"><span class="eyebrow">The family route challenge</span><h2>Turn “just one spin” into a Sussex County tradition.</h2><p>Bring some quarters, invite the kids, and make every route partner part of the adventure. A meal, a trim, a snack, or a simple thank-you helps keep local stops glowing.</p><ol class="steps"><li><b>01</b><div><strong>Start where you are</strong><p>Use the map to find your nearest stand and check the business hours before heading out.</p></div></li><li><b>02</b><div><strong>Chase a different mix</strong><p>Compare capsule lineups at each storefront instead of stopping after your first duplicate.</p></div></li><li><b>03</b><div><strong>Complete the passport</strong><p>Stamp all five stops, unlock Arcade Master, then revisit your favorites to finish the farm set.</p></div></li></ol><p class="note">Make it a grown-up-led outing: use sidewalks, cross carefully, and check hours before you travel.</p><a class="btn" href="#map-section">Plan our route →</a></div></div></section><section class="section"><div class="heading"><div><span class="eyebrow">Small-batch surprises</span><h2>Beyond the<br>barnyard.</h2></div><p>Select stands mix in niche drops for collectors, commuters, and fans. Check each business card for the exact lineup before you go.</p></div><div class="bonus-grid"><div class="bonus"><span>Country gear</span><h3>Utility & Bottle Openers</h3><p>Keychain bottle openers, mini carabiners, and country or trail stickers for parents, commuters, and regulars.</p></div><div class="bonus"><span>Fandom niche</span><h3>K-Pop Collector Drops</h3><p>Compact member photo strips and vinyl stickers for fans hunting a dedicated mini set.</p></div><div class="bonus"><span>Local makers</span><h3>Handmade Craft Keepsakes</h3><p>Mini woven bookmarks, beaded charms, stamped wood tokens, and small-batch craft tags.</p></div></div></section><section id="hosts" class="section"><div class="host"><div><span class="eyebrow">For Sussex & Wantage business owners</span><h2>Your storefront.<br>Our next little landmark.</h2><p>Amelia’s Amusements restores, stocks, cleans, and services each machine. You give families one more reason to step inside—and join a route that introduces them to neighboring businesses.</p></div><div class="benefits"><div><strong>20%</strong><span>Commission on coin collections</span></div><div><strong>$0</strong><span>Cost to host the stand</span></div><div><strong>0</strong><span>Electricity required</span></div><div><strong>Full</strong><span>Route service & restocking</span></div></div></div></section></main>${footer()}</div>`};
    const stopPage=s=>{const next=STOPS[s.number%5],others=STOPS.filter(x=>x.id!==s.id);return`<div class="site">${stopHeader()}<main><section class="stop-hero" data-testid="stop-page-${s.id}"><div><a class="back" href="${location.pathname}#route">← Route directory</a><span class="eyebrow">Stop #${s.number} · ${s.locality}, New Jersey</span><h1>${s.name}</h1><p class="lead">${s.role}. A pocket-change pause on the Sussex & Wantage country arcade trail, with its own reasons to spin and explore.</p><div class="stop-meta"><span>Address: ${s.address}</span><span>Hours: ${s.hours}</span></div><div class="actions"><a class="btn" href="${s.maps}" target="_blank" rel="noopener" data-testid="stop-directions">Get directions ↗</a><a class="btn ghost" href="#stop-lineup">See what’s inside</a></div></div><div class="number-cabinet">${bulbs(10)}${logo()}<span class="big-number">${String(s.number).padStart(2,"0")}</span><strong>Country Arcade Stop</strong><small>Restored · Mechanical · Non-Electric</small></div></section><section id="stop-lineup" class="section"><div class="stop-detail-grid"><div class="stop-detail"><span class="eyebrow">What machine & what product</span><h2>Your spin,<br>spelled out.</h2><div class="machine"><small>The machine at this stop</small><strong>${s.machine}</strong></div>${s.products.map((p,i)=>`<article class="stop-product" data-testid="stop-product-${i}"><b>${p[0]}</b><div><small>${i===0?"Gumball globe":"Capsule head"}</small><h3>${p[1]}</h3></div></article>`).join("")}</div><aside class="visit"><span class="eyebrow">Plan your family visit</span><h2>Make this stop part of the story.</h2><div class="visit-facts"><p><small>Find the stand</small>${s.address}</p><p><small>Business hours</small>${s.hours}</p><p><small>Support this route partner</small>Check hours before traveling and consider making a purchase while you visit.</p></div><p class="tip">♡ ${s.tip}</p><p class="note">Keep the route grown-up-led: use sidewalks, cross carefully, and check hours before you travel.</p><a class="next" href="?guide=${next.id}" data-link data-testid="next-stop"><span><small>Keep the adventure going · Stop #${next.number}</small>${next.name}</span>→</a></aside></div></section>${mapSection(true)}<section class="section"><div class="heading"><div><span class="eyebrow">Support the whole route</span><h2>Four more doors.<br>Four more finds.</h2></div><p>Every participating business makes the route possible. Explore the other lineups and give another local stop a place in your family outing.</p></div><div class="other-grid">${others.map(x=>`<a class="other" href="?guide=${x.id}" data-link data-testid="other-${x.id}"><b>0${x.number}</b><small>${x.locality} · ${x.role}</small><strong>${x.name}</strong><p>${x.products[1][1]}</p><span>Open stop guide →</span></a>`).join("")}</div></section></main>${footer()}</div>`};
    function updateSeo(stop){const title=stop?`${stop.name} Vending Stop | Amelia's Amusements`:"Country Arcade & Gumballs in Sussex NJ | Amelia's Amusements",desc=stop?`Visit Amelia's Amusements at ${stop.name} in ${stop.locality}, NJ. See the machine, lineup, hours, directions, and family route tips.`:"Explore five country arcade stops in Sussex and Wantage, NJ. Find dye-free gumballs, farm animal capsules, an interactive map, and family treasure hunts.",url=stop?`${SITE_URL}?guide=${stop.id}`:SITE_URL;document.title=title;const set=(sel,attr,val)=>document.querySelectorAll(sel).forEach(n=>n.setAttribute(attr,val));set('link[rel="canonical"]','href',url);set('meta[name="description"]','content',desc);set('meta[property="og:title"]','content',title);set('meta[property="og:description"]','content',desc);set('meta[property="og:url"]','content',url);set('meta[name="twitter:title"]','content',title);set('meta[name="twitter:description"]','content',desc);document.getElementById("stop-schema")?.remove();if(stop){const script=document.createElement("script");script.type="application/ld+json";script.id="stop-schema";script.textContent=JSON.stringify({"@context":"https://schema.org","@type":stop.id==="main-street-barbers"?"BarberShop":stop.id==="lorenzos-pizzeria"?"Restaurant":stop.id==="lukoil-wantage"?"GasStation":"LocalBusiness",name:stop.name,description:`${stop.machine}. ${stop.products.map(p=>p.join(" ")).join(" + ")}`,url,address:{"@type":"PostalAddress",streetAddress:stop.street,addressLocality:stop.locality,addressRegion:"NJ",postalCode:"07461",addressCountry:"US"},geo:{"@type":"GeoCoordinates",latitude:stop.lat,longitude:stop.lng}});document.head.appendChild(script)}}
    function initMap(){const el=document.getElementById("map");if(!el||typeof L==="undefined")return;if(map)map.remove();markers={};map=L.map(el,{scrollWheelZoom:false});L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);const guide=new URLSearchParams(location.search).get("guide");const points=STOPS.map(s=>{const icon=L.divIcon({className:"pin-wrap",html:`<div class="pin" data-testid="marker-${s.id}"><span>${s.number}</span></div>`,iconSize:[42,42],iconAnchor:[21,21]});const marker=L.marker([s.lat,s.lng],{icon,title:s.name}).addTo(map);marker.bindPopup(`<div class="popup"><small>STOP #${s.number}</small><strong>${s.name}</strong><p>${s.address}</p><p>${s.products.map(p=>p.join(" ")).join(" + ")}</p><a href="${s.maps}" target="_blank" rel="noopener">Google Maps directions →</a></div>`);marker.on("click",()=>{if(guide){history.pushState({},"",`?guide=${s.id}`);render(true)}else focusStop(s.id,false)});markers[s.id]=marker;return[s.lat,s.lng]});L.polyline(points,{color:"#f5b727",weight:3,opacity:.85,dashArray:"7, 10"}).addTo(map);bounds=L.latLngBounds(points);map.fitBounds(bounds,{padding:[40,40]});if(activeId&&markers[activeId])setTimeout(()=>focusStop(activeId,false),150)}
    function focusStop(id,scroll){const s=STOPS.find(x=>x.id===id);if(!s)return;activeId=id;document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.dataset.focus===id));document.querySelectorAll(".card").forEach(c=>c.classList.toggle("active",c.dataset.testid===`location-${id}`));if(map&&markers[id]){map.setView([s.lat,s.lng],16,{animate:true});markers[id].openPopup()}if(scroll)document.getElementById("map-section")?.scrollIntoView({behavior:"smooth"})}
    function render(scroll=false){const guide=new URLSearchParams(location.search).get("guide"),stop=STOPS.find(s=>s.id===guide),scanned=new URLSearchParams(location.search).get("stop");activeId=stop?.id||scanned||null;app.innerHTML=stop?stopPage(stop):home();updateSeo(stop);initMap();if(scroll)window.scrollTo({top:0,behavior:"instant"})}
    function toggle(key,id){const items=getItems(key),next=items.includes(id)?items.filter(x=>x!==id):[...items,id];localStorage.setItem(key,JSON.stringify(next));document.getElementById("treasure-quest").outerHTML=quest()}
    document.addEventListener("click",e=>{const link=e.target.closest("[data-link]");if(link){e.preventDefault();history.pushState({},"",link.getAttribute("href"));render(true);return}const menu=e.target.closest("[data-menu]");if(menu){document.getElementById("mobile-nav")?.classList.toggle("open");return}const focus=e.target.closest("[data-focus]");if(focus){const guide=new URLSearchParams(location.search).get("guide");if(guide&&guide!==focus.dataset.focus){history.pushState({},"",`?guide=${focus.dataset.focus}`);render(true)}else focusStop(focus.dataset.focus,focus.hasAttribute("data-scroll-map"));return}if(e.target.closest("[data-reset-map]")){activeId=null;document.querySelectorAll(".chip,.card").forEach(x=>x.classList.remove("active"));if(map&&bounds){map.closePopup();map.fitBounds(bounds,{padding:[40,40]})}return}const collect=e.target.closest("[data-collect]");if(collect){toggle("amelias_farm_animals_v1",collect.dataset.collect);return}const pass=e.target.closest("[data-passport]");if(pass){toggle("amelias_route_passport_v1",pass.dataset.passport);return}const reset=e.target.closest("[data-reset]");if(reset){localStorage.setItem(reset.dataset.reset,"[]");document.getElementById("treasure-quest").outerHTML=quest()}});
    window.addEventListener("popstate",()=>render(true));render();
  </script>
